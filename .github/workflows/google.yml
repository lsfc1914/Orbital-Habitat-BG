// CYBERVAPOR MEGAPOLIS — Web-Swing Edition
// Boot, asset-driven loading, strict phase machine (boot → loading → menu → play ⇄ pause),
// fixed-step loop, quality fallback, error guards, self-test entry point.
// PATCH 2026-10-26 v3: on-screen error log (phones have no visible console), error toasts
// carry the message, errorLog array in test surface. Keeps v2 fixes: boot→loading phase
// transition (+ safety shim), start fallback, safeLock(), single endFrame, module acc,
// everLocked guard, no rethrow in onError, plaza-facing menu rigs.
import * as THREE from 'three';
import { CHARACTERS, FIXED_DT, QUALITY, STATE_LABELS, VERSION } from './core/config.js';
import { makeRng } from './core/rng.js';
import { Input } from './core/input.js';
import { AssetLoader } from './core/loader.js';
import { PhysicsWorld } from './world/physics.js';
import { buildCity } from './world/city.js';
import { Sky } from './world/sky.js';
import { Pipeline } from './engine/postfx.js';
import { QualityManager } from './engine/quality.js';
import { CharacterRig } from './player/rig.js';
import { WebRenderer } from './player/webs.js';
import { PlayerController } from './player/controller.js';
import { CineCamera } from './camera/cine.js';
import { UI } from './ui/ui.js';
import { TouchControls } from './ui/touch.js';
import { runSelfTest } from './ui/tests.js';

// FIX v4: touch browsers throw InvalidStateError from setPointerCapture when the
// pointer is already gone (stale pointerId - common with multi-touch and fast taps).
// Harmless by itself, but it used to reach onError and AUTO-PAUSE the game during
// play. Swallow it globally - losing capture on a dead pointer has no effect.
(() => {
  if (typeof Element === 'undefined' || !Element.prototype.setPointerCapture) return;
  const orig = Element.prototype.setPointerCapture;
  Element.prototype.setPointerCapture = function (pointerId) {
    try { orig.call(this, pointerId); } catch { /* stale pointer - safe to ignore */ }
  };
})();

const params = new URLSearchParams(location.search);
let phase = 'boot';
const PHASE_EDGES = {
  boot: ['loading'], loading: ['menu'], menu: ['play'],
  play: ['pause', 'menu'], pause: ['play', 'menu'],
};
const setPhase = (next) => {
  if (!PHASE_EDGES[phase] || !PHASE_EDGES[phase].includes(next)) {
    console.warn(`[phase] illegal ${phase} -> ${next}`);
    return false;
  }
  console.info(`[phase] ${phase} -> ${next}`);
  phase = next;
  return true;
};

let renderer, scene, camera, input, physics, pipeline, quality, sky, city, webs, cine, player;
let ui, touchControls;
let rigs = {};
let playerChar = 'volt';
let shardsCollected = 0;
let lastDrawCalls = 0;
let errorCount = 0;
let lastErrorTime = 0;
let lastAnim = '';
let fovBase = 75;
let acc = 0; // fixed-step accumulator lives here so tick() can mutate it
const menuCenter = new THREE.Vector3(35, 2, 40);

async function main() {
  ui = new UI({
    onStart: startGame,
    onResume: resume,
    onQuit: quitToMenu,
    onSelfTest: () => runSelfTest(window.__CM).catch((e) => console.error(e)),
    onSettings: onSettingChanged,
  });
  ui.showLoader();
  ui.tip('WASD to move · hold LMB near buildings to swing · RMB to zip');
  ui.setBuild(`build ${VERSION}`);
  setPhase('loading'); // FIX v2: leave 'boot' — without this the phase machine sticks at boot forever and start/pause bounce off the guard

  // ---- quality / renderer --------------------------------------------------
  const qParam = params.get('quality');
  let qName = 'high';
  let auto = true;
  if (qParam && QUALITY[qParam]) { qName = qParam; auto = false; }
  else if (ui.settings.quality && ui.settings.quality !== 'auto') { qName = ui.settings.quality; auto = false; }
  quality = new QualityManager(qName, auto);

  const canvas = document.getElementById('gl');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, quality.settings.pixelRatio));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.info.autoReset = false;
  if (!renderer.getContext()) throw new Error('WebGL2 context is unavailable in this browser.');

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(fovBase, window.innerWidth / window.innerHeight, 0.1, 3200);
  camera.position.set(46, 5, 51);

  physics = new PhysicsWorld(16);
  input = new Input(canvas);
  touchControls = new TouchControls(input, { onPause: () => { if (phase === 'play') pause(); else if (phase === 'pause') resume(); } });
  input.sensitivity = ui.settings.sens;
  input.invertY = ui.settings.invertY;
  // PATCH: pause on lock loss only if a pointer lock was actually acquired at least once
  // (touch devices fire spurious lock events — without this a phone could pause instantly)
  let everLocked = false;
  document.addEventListener('pointerlockchange', () => { if (document.pointerLockElement) everLocked = true; });
  input.onLockLost = () => { if (phase === 'play' && !document.hidden && everLocked) pause(); };
  cine = new CineCamera(camera, input, physics);
  pipeline = new Pipeline(renderer, scene, camera);

  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    ui.notify('GPU context lost — attempting recovery…', 'bad');
    if (phase === 'play') pause();
  });
  canvas.addEventListener('webglcontextrestored', () => {
    ui.notify('GPU context restored.', 'info');
    applyQuality(quality.name, true);
  });

  // ---- asset-driven loading ------------------------------------------------
  let manifest;
  try {
    const res = await fetch('./assets/manifest.json');
    manifest = await res.json();
  } catch (e) {
    console.warn('manifest unavailable, using built-in steps', e);
    manifest = { steps: [
      { id: 'sky', weight: 2, label: 'Sky' }, { id: 'city', weight: 10, label: 'City' },
      { id: 'traffic', weight: 2, label: 'Traffic' }, { id: 'char-volt', weight: 3, label: 'VOLT' },
      { id: 'char-rhap', weight: 3, label: 'RHAPSODY' }, { id: 'postfx', weight: 1, label: 'Post FX' },
    ], optional: [] };
  }

  const rng = makeRng(Number(params.get('seed')) || 1337);
  const state = { city: null };
  const builders = {
    'sky': function* () {
      sky = new Sky(scene, renderer);
      sky.setTOD(ui.settings.tod || params.get('tod') || 'dusk', true);
    },
    'city': function* () {
      state.city = yield* buildCity(scene, physics, rng, quality.name, state);
    },
    'traffic': function* () {
      webs = new WebRenderer(scene);
    },
    'char-volt': function* () { rigs.volt = new CharacterRig('volt'); scene.add(rigs.volt.root); },
    'char-rhap': function* () { rigs.rhapsody = new CharacterRig('rhapsody'); scene.add(rigs.rhapsody.root); },
    'postfx': function* () {
      pipeline.apply(quality.settings);
      applyQuality(quality.name, true);
    },
    'onGlb': () => {},
  };

  const loader = new AssetLoader(manifest, builders);
  await loader.run(
    (p, label) => ui.progress(p, label),
    (line) => { ui.log(line); console.info('[load]', line); },
  );

  city = state.city;
  player = new PlayerController({
    physics, cine, input,
    notify: (m, k) => ui.notify(m, k),
    params: CHARACTERS.volt,
    spawn: city.spawn,
  });
  player.active = false;

  // menu: both rigs on their pedestals
  for (const rig of Object.values(rigs)) rig.root.visible = true;
  placeMenuRigs();

  if (phase === 'boot') setPhase('loading'); // FIX v2 safety: guarantee a legal path into 'menu'
  setPhase('menu');
  ui.showMenu();
  applyQuality(quality.name, true);

  window.addEventListener('resize', onResize);
  window.addEventListener('error', onError);
  window.addEventListener('unhandledrejection', (e) => onError(e.reason || e));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && phase === 'play') pause();
  });

  let last = performance.now();
  const frame = (now) => {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    try {
      tick(dt, now);
    } catch (e) {
      onError(e);
    }
    input.endFrame();
  };
  requestAnimationFrame(frame);

  if (params.get('autotest') === '1') {
    await new Promise((r) => setTimeout(r, 800));
    try { await runSelfTest(window.__CM); } catch (e) { console.error(e); }
  }
}

// ------------------------------------------------------------ gameplay wiring
function placeMenuRigs() {
  const spots = city.pedestalSpots;
  const names = ['volt', 'rhapsody'];
  for (let i = 0; i < names.length; i++) {
    const rig = rigs[names[i]];
    const s = spots[i];
    rig.root.position.set(s[0], s[1], s[2]);
    rig.root.rotation.y = Math.atan2(35 - s[0], 40 - s[2]); // PATCH: actually face the plaza center
  }
}

// PATCH: touch devices have no Pointer Lock — never let it throw out of a click handler
function safeLock() {
  try { input.requestLock(); } catch (e) { /* no Pointer Lock on touch; touch controls handle input */ }
}

function startGame(char) {
  // PATCH: never silently ignore an invalid/missing character — fall back to the
  // selected card (if tagged data-char) or VOLT, and say so on screen.
  if (!CHARACTERS[char]) {
    const el = document.querySelector('.char-card.selected[data-char]');
    char = (el && CHARACTERS[el.dataset.char]) ? el.dataset.char : 'volt';
    if (ui) ui.notify('Start: fallback → ' + char.toUpperCase(), 'warn');
  }
  if (phase !== 'menu') { if (phase === 'pause' || phase === 'play') { if (!setPhase('menu')) return; } else return; } // v5: mid-play character switch allowed
  if (!setPhase('play')) return;
  playerChar = char;
  ui.selectChar(char);
  player.params = CHARACTERS[char];
  player.reset();
  player.active = true;
  rigs.volt.root.visible = char === 'volt';
  rigs.rhapsody.root.visible = char === 'rhapsody';
  player.facing = 0;
  cine.menu = false;
  cine.yaw = Math.PI;
  cine.pitch = -0.12;
  cine.pos.set(player.pos.x, player.pos.y + 2.5, player.pos.z - 6);
  cine.look.set(player.pos.x, player.pos.y + 1, player.pos.z);
  lastAnim = '';
  webs.hide();
  ui.hideModals();
  ui.showHUD();
  touchControls?.show();
  safeLock();
  if (!startGame._welcomed) {
    startGame._welcomed = true;
    ui.notify('Welcome to the Megapolis. Hold LMB near a tower to swing.', 'info');
  }
}

function pause() {
  if (!setPhase('pause')) return;
  player.active = false;
  ui.showPause();
  touchControls?.hide();
  input.exitLock();
}

function resume() {
  if (!setPhase('play')) return;
  ui.hidePause();
  ui.hideModals();
  player.active = true;
  touchControls?.show();
  safeLock();
}

function quitToMenu() {
  if (!setPhase('menu')) return;
  player.active = false;
  webs.hide();
  ui.hidePause();
  ui.hideModals();
  ui.showMenu();
  touchControls?.hide();
  input.exitLock();
  cine.menu = true;
  rigs.volt.root.visible = true;
  rigs.rhapsody.root.visible = true;
  placeMenuRigs();
}

function onSettingChanged(key, value) {
  switch (key) {
    case 'sens': input.sensitivity = value; break;
    case 'invertY': input.invertY = value; break;
    case 'tod': if (phase !== 'loading' && sky) sky.setTOD(value); break;
    case 'fov': fovBase = value; camera.fov = value; camera.updateProjectionMatrix(); break;
    case 'shake': case 'motion':
      cine.reduceMotion = !ui.settings.shake || ui.settings.reduceMotion;
      break;
    case 'quality': {
      if (value === 'auto') { quality.auto = true; }
      else { quality.auto = false; quality.set(value, true); applyQuality(value, true); }
      break;
    }
    default: break;
  }
}

function applyQuality(name, silent) {
  const q = QUALITY[name];
  if (!q) return;
  quality.name = name;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q.pixelRatio));
  renderer.shadowMap.enabled = !!q.shadows;
  scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; });
  if (sky) {
    sky.setShadows(q.shadows ? q.shadowSize : 0);
    sky.setQuality(q.fogAdd);
  }
  if (city && city.setQuality) city.setQuality(name);
  pipeline.apply(q);
  pipeline.setSize(window.innerWidth, window.innerHeight);
  if (!silent) ui.notify(`Quality: ${name.toUpperCase()}`, 'info');
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  pipeline.setSize(window.innerWidth, window.innerHeight);
}

// ---- on-screen error log (debug): phones have no visible console — show errors on screen
const errorLog = [];
let errPanel = null;
function updateErrorPanel() {
  if (!errPanel) {
    errPanel = document.createElement('div');
    errPanel.style.cssText = 'position:fixed;top:4.2rem;left:0.7rem;z-index:45;pointer-events:none;' +
      'max-width:70vw;background:rgba(24,6,12,0.85);border:1px solid #ff4d5e;border-radius:6px;' +
      'padding:0.45rem 0.6rem;font:600 0.62rem/1.35 Consolas,monospace;color:#ffb9c0;' +
      'text-shadow:0 1px 2px #000;white-space:pre-wrap;display:none';
    document.body.appendChild(errPanel);
  }
  if (!errorLog.length) { errPanel.style.display = 'none'; return; }
  const lines = ['⚠ ' + errorLog.length + ' RUNTIME ERROR' + (errorLog.length === 1 ? '' : 'S')];
  for (let i = errorLog.length - 1, n = 0; i >= 0 && n < 3; i--, n++) {
    let m = errorLog[i];
    if (m.length > 70) m = m.slice(0, 70) + '…';
    lines.push('· ' + m);
  }
  errPanel.textContent = lines.join('\n');
  errPanel.style.display = 'block';
}

function onError(err) {
  errorCount++;
  const msg = err && err.message ? err.message : String(err);
  errorLog.push(msg + ' @' + phase); // v3: record where it happened
  if (errorLog.length > 20) errorLog.shift();
  updateErrorPanel();
  console.error('[runtime]', err);
  if (phase === 'boot' || phase === 'loading') {
    ui.fatal('The city failed to load.', msg + '\n\nCheck that you are serving this folder over http(s) and using a WebGL2 browser.');
    return; // no rethrow — it only double-counts and spams the console
  }
  const now = performance.now();
  if (now - lastErrorTime < 5000) {
    ui.fatal('Repeated faults — please reboot the simulation.', msg + '\n' + (err && err.stack ? err.stack : ''));
  } else {
    lastErrorTime = now;
    if (phase === 'play') pause();
    ui.notify('Recovered from an internal error: ' + msg, 'bad');
  }
}

// ------------------------------------------------------------ frame update
function tick(dt) {
  renderer.info.reset();
  const autoDrop = quality.frame(dt);
  if (autoDrop) applyQuality(autoDrop);

  if (phase === 'play') {
    if (input.btnPressed_('rmb')) player.beginZip();
    if (input.btnDown('lmb')) player._tryAttach();
    if (input.wasPressed('Escape')) { pause(); }
    if (input.wasPressed('Digit1')) { sky.setTOD('day'); ui.settings.tod = 'day'; }
    if (input.wasPressed('Digit2')) { sky.setTOD('dusk'); ui.settings.tod = 'dusk'; }
    if (input.wasPressed('Digit3')) { sky.setTOD('night'); ui.settings.tod = 'night'; }
    let n = 0;
    acc += dt;
    while (acc >= FIXED_DT && n < 6) { player.update(FIXED_DT); acc -= FIXED_DT; n++; }
    if (n === 6) acc = 0;
    updatePlay(dt);
  } else if (phase === 'menu') {
    updateMenu(dt);
  }

  sky.update(dt, phase === 'menu' ? menuCenter : player.pos, renderer);
  pipeline.render(dt);
  lastDrawCalls = renderer.info.render.calls;
}

function updatePlay(dt) {
  const rig = rigs[playerChar];
  const halfH = 0.86;
  rig.root.position.set(player.pos.x, player.pos.y - halfH, player.pos.z);
  rig.root.rotation.y = player.facing;
  rig.root.updateMatrixWorld(true);
  rig.handWorld(player.rope.hand, player.webFrom);

  if (player.state === 'swing') {
    webs.show(player.webFrom, player.rope.anchor, 'swing');
    webs.update(dt, player.webFrom, player.rope.anchor, camera);
  } else if (player.state === 'zip') {
    webs.show(player.webFrom, player.zip.target, 'zip');
    webs.update(dt, player.webFrom, player.zip.target, camera);
  } else if (webs.active) {
    webs.hide();
  }

  if (player.anim !== lastAnim) {
    lastAnim = player.anim;
    rig.play(player.anim);
  }
  rig.update(dt, {
    speed: player.speed2D,
    sprint: player._wish ? player._wish.sprint : false,
    dive: player.dive,
    wallSide: player.wallSide,
  });

  cine.update(dt, {
    pos: player.pos, vel: player.vel, state: player.state, speed: player.vel.length(),
  });

  city.update(dt, player.pos, (count) => {
    shardsCollected = count;
    ui.hud({ shards: count });
    ui.notify(`DATA SHARD ${count}/36 acquired`, 'info');
    cine.addShake(0.08);
  });

  ui.hud({
    speed: player.vel.length() * 3.6,
    alt: player.pos.y,
    state: STATE_LABELS[player.state] + (player.dive ? ' · DIVE' : ''),
    district: city.districtAt(player.pos.x, player.pos.z),
    fps: quality.fpsAvg,
    shards: shardsCollected,
    quality: quality.name,
  });
}

function updateMenu(dt) {
  cine.menu = true;
  cine.update(dt, {});
  for (const name of ['volt', 'rhapsody']) {
    const rig = rigs[name];
    rig.play('idle');
    rig.update(dt, { speed: 0 });
  }
  city.update(dt, null, null);
}

// ------------------------------------------------------------ test surface
window.__CM = {
  get phase() { return phase; },
  get player() { return player; },
  get city() { return city; },
  get physics() { return physics; },
  get input() { return input; },
  get quality() { return quality; },
  get sky() { return sky; },
  get cine() { return cine; },
  get camera() { return camera; },
  get rigs() { return rigs; },
  get ui() { return ui; },
  get renderer() { return renderer; },
  get playerChar() { return playerChar; },
  get lastDrawCalls() { return lastDrawCalls; },
  get errorCount() { return errorCount; },
  get errorLog() { return errorLog; },
  get shardsCollected() { return shardsCollected; },
  get __shards() { return city && city._shards; },
  startGame, pause, resume, quitToMenu,
};

main().catch((e) => {
  console.error(e);
  const el = document.getElementById('fatal');
  if (el) {
    el.classList.remove('hidden');
    const m = document.getElementById('fatal-msg');
    const d = document.getElementById('fatal-detail');
    if (m) m.textContent = 'Boot failure: ' + (e && e.message ? e.message : String(e));
    if (d) d.textContent = e && e.stack ? e.stack : '';
  }
});# This workflow will build a docker container, publish it to Google Container
# Registry, and deploy it to GKE when there is a push to the "main"
# branch.
#
# To configure this workflow:
#
# 1. Enable the following Google Cloud APIs:
#
#    - Artifact Registry (artifactregistry.googleapis.com)
#    - Google Kubernetes Engine (container.googleapis.com)
#    - IAM Credentials API (iamcredentials.googleapis.com)
#
#    You can learn more about enabling APIs at
#    https://support.google.com/googleapi/answer/6158841.
#
# 2. Ensure that your repository contains the necessary configuration for your
#    Google Kubernetes Engine cluster, including deployment.yml,
#    kustomization.yml, service.yml, etc.
#
# 3. Create and configure a Workload Identity Provider for GitHub:
#    https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation.
#
#    Depending on how you authenticate, you will need to grant an IAM principal
#    permissions on Google Cloud:
#
#    - Artifact Registry Administrator (roles/artifactregistry.admin)
#    - Kubernetes Engine Developer (roles/container.developer)
#
#    You can learn more about setting IAM permissions at
#    https://cloud.google.com/iam/docs/manage-access-other-resources
#
# 5. Change the values in the "env" block to match your values.

name: 'Build and Deploy to GKE'

on:
  push:
    branches:
      - '"main"'

env:
  PROJECT_ID: 'my-project' # TODO: update to your Google Cloud project ID
  GAR_LOCATION: 'us-central1' # TODO: update to your region
  GKE_CLUSTER: 'cluster-1' # TODO: update to your cluster name
  GKE_ZONE: 'us-central1-c' # TODO: update to your cluster zone
  DEPLOYMENT_NAME: 'gke-test' # TODO: update to your deployment name
  REPOSITORY: 'samples' # TODO: update to your Artifact Registry docker repository name
  IMAGE: 'static-site'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider' # TODO: update to your workload identity provider

jobs:
  setup-build-publish-deploy:
    name: 'Setup, Build, Publish, and Deploy'
    runs-on: 'ubuntu-latest'
    environment: 'production'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      # Configure Workload Identity Federation and generate an access token.
      #
      # See https://github.com/google-github-actions/auth for more options,
      # including authenticating via a JSON credentials file.
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: 'Docker Auth'
        uses: 'docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567' # docker/login-action@v3
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.auth_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      # Get the GKE credentials so we can deploy to the cluster
      - name: 'Set up GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@6051de21ad50fbb1767bc93c11357a49082ad116' # google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_ZONE }}'

      # Build the Docker image
      - name: 'Build and push Docker container'
        run: |-
          DOCKER_TAG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"

          docker build \
            --tag "${DOCKER_TAG}" \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --build-arg GITHUB_REF="${GITHUB_REF}" \
            .

          docker push "${DOCKER_TAG}"

      # Set up kustomize
      - name: 'Set up Kustomize'
        run: |-
          curl -sfLo kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          chmod u+x ./kustomize

      # Deploy the Docker image to the GKE cluster
      - name: 'Deploy to GKE'
        run: |-
          # replacing the image name in the k8s template
          ./kustomize edit set image LOCATION-docker.pkg.dev/PROJECT_ID/REPOSITORY/IMAGE:TAG=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA
          ./kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/$DEPLOYMENT_NAME
          kubectl get services -o wide
