name: Build and deploy Orbital Habitat

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: false

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No ZIP archive found in repository root."
            exit 1
          fi
          mkdir -p _source
          unzip -q "$ARCHIVE" -d _source
          test -f _source/app/package.json

      - name: Install dependencies
        run: npm ci --prefix _source/app

      - name: Build website
        run: npm run build --prefix _source/app

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _source/app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
